<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canvas Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #111110;
    --panel: #1a1917;
    --panel2: #221f1c;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.13);
    --text: #e8e4dc;
    --muted: #7a7570;
    --accent: #d4a853;
    --accent2: #c46f3c;
    --radius: 10px;
    --sidebar: 78px;
    --toolbar: 56px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    user-select: none;
  }

  /* TOP BAR */
  header {
    height: var(--toolbar);
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 20px;
    flex-shrink: 0;
    z-index: 10;
  }
  .logo {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-size: 20px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin-right: 8px;
    white-space: nowrap;
  }
  .logo span { font-style: italic; }

  .divider-v { width: 1px; height: 28px; background: var(--border2); flex-shrink: 0; }

  .header-section { display: flex; align-items: center; gap: 10px; }
  .header-label { font-size: 9px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 2px; }

  .size-display {
    font-size: 11px; color: var(--text); background: var(--panel2);
    border: 1px solid var(--border2); border-radius: 6px;
    padding: 4px 10px; min-width: 40px; text-align: center;
  }

  .slider-wrap { display: flex; align-items: center; gap: 8px; }
  input[type="range"] {
    -webkit-appearance: none; width: 100px; height: 3px;
    background: var(--border2); border-radius: 2px; outline: none; cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent); cursor: pointer; border: none;
    box-shadow: 0 0 0 3px rgba(212,168,83,0.2);
  }
  input[type="range"]::-webkit-slider-runnable-track { background: transparent; }

  .header-btn {
    background: var(--panel2); border: 1px solid var(--border2);
    color: var(--text); font-family: 'DM Mono', monospace;
    font-size: 11px; padding: 6px 14px; border-radius: 6px;
    cursor: pointer; transition: all 0.15s; white-space: nowrap;
    display: flex; align-items: center; gap: 6px;
  }
  .header-btn:hover { border-color: var(--accent); color: var(--accent); }
  .header-btn svg { width: 13px; height: 13px; }

  .btn-danger { color: #e06c6c; }
  .btn-danger:hover { border-color: #e06c6c; color: #e06c6c; }

  .dl-btn {
    background: var(--accent); border: none; color: #1a1510;
    font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 500;
    padding: 7px 16px; border-radius: 6px; cursor: pointer;
    transition: all 0.15s; margin-left: auto; white-space: nowrap;
    display: flex; align-items: center; gap: 6px;
  }
  .dl-btn:hover { background: #e0b86a; transform: translateY(-1px); }
  .dl-btn svg { width: 14px; height: 14px; }

  /* OPACITY */
  .opacity-wrap { display: flex; align-items: center; gap: 8px; }
  .opacity-val { font-size: 11px; color: var(--muted); min-width: 32px; text-align: right; }

  /* MAIN LAYOUT */
  .workspace {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* LEFT SIDEBAR: TOOLS */
  .sidebar {
    width: var(--sidebar);
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 14px 0;
    gap: 6px;
    flex-shrink: 0;
    overflow-y: auto;
  }
  .sidebar-section-label {
    font-size: 8px; color: var(--muted); letter-spacing: 0.12em;
    text-transform: uppercase; margin: 6px 0 2px; width: 100%;
    text-align: center;
  }
  .tool-btn {
    width: 48px; height: 48px; border-radius: 10px;
    background: transparent; border: 1px solid transparent;
    color: var(--muted); cursor: pointer;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 3px; transition: all 0.15s;
    font-family: 'DM Mono', monospace; font-size: 8px;
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .tool-btn svg { width: 20px; height: 20px; transition: all 0.15s; }
  .tool-btn:hover { background: var(--panel2); border-color: var(--border2); color: var(--text); }
  .tool-btn.active {
    background: rgba(212,168,83,0.12); border-color: rgba(212,168,83,0.4);
    color: var(--accent);
  }
  .sidebar-sep { width: 40px; height: 1px; background: var(--border); margin: 4px 0; }

  /* RIGHT SIDEBAR: COLORS */
  .color-panel {
    width: 200px;
    background: var(--panel);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 14px;
    gap: 14px;
    flex-shrink: 0;
    overflow-y: auto;
  }
  .panel-title {
    font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted);
  }

  .current-color-wrap {
    display: flex; align-items: center; gap: 10px;
  }
  .current-color-swatch {
    width: 40px; height: 40px; border-radius: 8px;
    border: 2px solid var(--border2); cursor: pointer;
    flex-shrink: 0; transition: border-color 0.15s;
    position: relative; overflow: hidden;
  }
  .current-color-swatch:hover { border-color: var(--accent); }
  #colorPickerInput {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }
  .current-color-info { flex: 1; }
  .color-hex {
    font-size: 12px; color: var(--text); letter-spacing: 0.04em;
    background: var(--panel2); border: 1px solid var(--border2);
    border-radius: 5px; padding: 4px 8px; width: 100%;
    font-family: 'DM Mono', monospace; cursor: pointer;
  }

  .palette-grid {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px;
  }
  .swatch {
    width: 100%; aspect-ratio: 1; border-radius: 6px; cursor: pointer;
    border: 2px solid transparent; transition: all 0.12s;
    position: relative;
  }
  .swatch:hover { transform: scale(1.1); border-color: rgba(255,255,255,0.3); }
  .swatch.selected { border-color: white; transform: scale(1.05); }
  .swatch.selected::after {
    content: ''; position: absolute; inset: 3px;
    border-radius: 2px; border: 1.5px solid rgba(255,255,255,0.6);
  }

  .custom-colors-row { display: flex; gap: 5px; flex-wrap: wrap; }
  .add-color-btn {
    width: 28px; height: 28px; border-radius: 5px; border: 1px dashed var(--border2);
    background: transparent; color: var(--muted); cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.12s; font-family: monospace; position: relative;
  }
  .add-color-btn:hover { border-color: var(--accent); color: var(--accent); }
  #customColorAdder { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

  .custom-swatch {
    width: 28px; height: 28px; border-radius: 5px; border: 2px solid transparent;
    cursor: pointer; transition: all 0.12s; flex-shrink: 0;
  }
  .custom-swatch:hover { transform: scale(1.1); border-color: rgba(255,255,255,0.3); }
  .custom-swatch.selected { border-color: white; }

  /* CANVAS */
  .canvas-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0e0d0c;
    background-image: radial-gradient(circle at 50% 0%, rgba(212,168,83,0.03) 0%, transparent 60%);
    position: relative;
    overflow: hidden;
  }

  #mainCanvas {
    background: #fff;
    border-radius: 4px;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 20px 80px rgba(0,0,0,0.7);
    cursor: crosshair;
    display: block;
    max-width: 100%;
    max-height: 100%;
  }

  /* ZOOM INFO */
  .canvas-info {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--border2);
    border-radius: 20px; padding: 5px 14px; font-size: 10px; color: var(--muted);
    display: flex; align-items: center; gap: 10px; pointer-events: none;
  }
  .canvas-info span { color: var(--text); }

  /* BRUSH PREVIEW */
  .brush-preview-wrap {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .brush-preview {
    width: 80px; height: 80px; border-radius: 8px;
    background: #1a1917; border: 1px solid var(--border2);
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  #previewCanvas { border-radius: 5px; }

  /* HISTORY INDICATOR */
  .history-info {
    display: flex; gap: 6px; align-items: center;
    font-size: 9px; color: var(--muted);
  }
  .hist-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border2); }
  .hist-dot.active { background: var(--accent); }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }
</style>
</head>
<body>

<!-- TOP BAR -->
<header>
  <div class="logo">Canvas <span>Studio</span></div>
  <div class="divider-v"></div>

  <div class="header-section">
    <div>
      <div class="header-label">Brush Size</div>
      <div class="slider-wrap">
        <input type="range" id="sizeSlider" min="1" max="80" value="12">
        <div class="size-display" id="sizeDisplay">12</div>
      </div>
    </div>
  </div>

  <div class="divider-v"></div>

  <div class="header-section">
    <div>
      <div class="header-label">Opacity</div>
      <div class="slider-wrap">
        <input type="range" id="opacitySlider" min="5" max="100" value="100">
        <span class="opacity-val" id="opacityVal">100%</span>
      </div>
    </div>
  </div>

  <div class="divider-v"></div>

  <!-- Quick size presets -->
  <div class="header-section" style="gap:5px">
    <div class="header-label" style="width:100%">Quick sizes</div>
  </div>
  <div style="display:flex;gap:5px;align-items:center">
    <button class="header-btn" onclick="setSize(2)" title="XS">XS</button>
    <button class="header-btn" onclick="setSize(8)" title="S">S</button>
    <button class="header-btn" onclick="setSize(18)" title="M">M</button>
    <button class="header-btn" onclick="setSize(36)" title="L">L</button>
    <button class="header-btn" onclick="setSize(60)" title="XL">XL</button>
  </div>

  <div class="divider-v"></div>

  <div style="display:flex;gap:6px;align-items:center">
    <button class="header-btn btn-danger" onclick="clearCanvas()" title="Clear canvas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
      Clear
    </button>
    <button class="header-btn" onclick="undo()" title="Undo (Ctrl+Z)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6M3.13 13A9 9 0 1012 21"/></svg>
      Undo
    </button>
    <button class="header-btn" onclick="redo()" title="Redo (Ctrl+Y)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 7v6h-6M20.87 13A9 9 0 1112 21"/></svg>
      Redo
    </button>
  </div>

  <button class="dl-btn" onclick="downloadImage()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
    Export PNG
  </button>
</header>

<div class="workspace">

  <!-- LEFT: TOOL SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-section-label">Draw</div>

    <button class="tool-btn active" id="btn-pen" onclick="selectTool('pen')" title="Pen — smooth precise strokes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      Pen
    </button>

    <button class="tool-btn" id="btn-brush" onclick="selectTool('brush')" title="Brush — soft textured strokes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9.06 11.9l8.07-8.06a2.85 2.85 0 114.03 4.03l-8.06 8.08"/><path d="M7.07 14.94C5.79 16.2 4 16 4 16s.2-1.79 1.45-3.07A2.5 2.5 0 018.5 14.5a2.5 2.5 0 01-1.43.44z"/></svg>
      Brush
    </button>

    <button class="tool-btn" id="btn-marker" onclick="selectTool('marker')" title="Marker — flat ink strokes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="7" y="2" width="10" height="14" rx="2"/><path d="M12 16v6M9 22h6"/></svg>
      Marker
    </button>

    <button class="tool-btn" id="btn-chalk" onclick="selectTool('chalk')" title="Chalk — rough grainy strokes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20l4-4L20 4l2 2L10 18 6 22z"/><circle cx="16" cy="8" r="1" fill="currentColor"/><circle cx="18" cy="6" r=".7" fill="currentColor"/></svg>
      Chalk
    </button>

    <button class="tool-btn" id="btn-spray" onclick="selectTool('spray')" title="Spray — scattered dot spray">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="12" width="14" height="8" rx="2"/><path d="M16 14h2a2 2 0 002-2v-2a2 2 0 00-2-2h-2"/><circle cx="8" cy="6" r="2"/><line x1="8" y1="8" x2="8" y2="12"/><circle cx="6" cy="5" r=".5" fill="currentColor"/><circle cx="10" cy="5" r=".5" fill="currentColor"/><circle cx="8" cy="3" r=".5" fill="currentColor"/></svg>
      Spray
    </button>

    <button class="tool-btn" id="btn-watercolor" onclick="selectTool('watercolor')" title="Watercolor — translucent washes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2.69l5.66 5.66a8 8 0 11-11.31 0z"/></svg>
      Water
    </button>

    <div class="sidebar-sep"></div>
    <div class="sidebar-section-label">Erase</div>

    <button class="tool-btn" id="btn-eraser-s" onclick="selectTool('eraser-s')" title="Small eraser">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 20H7L3 16l13-13 8 8-4 9z"/><line x1="6.5" y1="17.5" x2="14" y2="10"/></svg>
      <span>S Erase</span>
    </button>

    <button class="tool-btn" id="btn-eraser-m" onclick="selectTool('eraser-m')" title="Medium eraser">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M12 10V6l-4 4M12 10V6l4 4"/></svg>
      <span>M Erase</span>
    </button>

    <button class="tool-btn" id="btn-eraser-l" onclick="selectTool('eraser-l')" title="Large eraser">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="8" width="20" height="12" rx="2"/><path d="M2 14h20"/></svg>
      <span>L Erase</span>
    </button>

    <div class="sidebar-sep"></div>
    <div class="sidebar-section-label">Shape</div>

    <button class="tool-btn" id="btn-line" onclick="selectTool('line')" title="Straight line">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="5" y1="19" x2="19" y2="5"/><circle cx="5" cy="19" r="1.5" fill="currentColor"/><circle cx="19" cy="5" r="1.5" fill="currentColor"/></svg>
      Line
    </button>

    <button class="tool-btn" id="btn-rect" onclick="selectTool('rect')" title="Rectangle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="6" width="16" height="12" rx="1.5"/></svg>
      Rect
    </button>

    <button class="tool-btn" id="btn-circle" onclick="selectTool('circle')" title="Circle/Ellipse">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="12" cy="12" rx="9" ry="6"/></svg>
      Circle
    </button>
  </div>

  <!-- CENTER: CANVAS -->
  <div class="canvas-area" id="canvasArea">
    <canvas id="mainCanvas"></canvas>
    <div class="canvas-info">
      <span id="canvasSize">1200 × 800</span>
      <span>·</span>
      Tool: <span id="currentToolInfo">pen</span>
      <span>·</span>
      <span id="coordInfo">–</span>
    </div>
  </div>

  <!-- RIGHT: COLOR PANEL -->
  <div class="color-panel">

    <div class="panel-title">Active Color</div>
    <div class="current-color-wrap">
      <div class="current-color-swatch" id="currentSwatch" style="background:#2c2c2c">
        <input type="color" id="colorPickerInput" value="#2c2c2c">
      </div>
      <div class="current-color-info">
        <input class="color-hex" type="text" id="hexInput" value="#2c2c2c" maxlength="7" spellcheck="false">
      </div>
    </div>

    <div class="sidebar-sep" style="width:100%"></div>
    <div class="panel-title">Palette</div>

    <div class="palette-grid" id="paletteGrid"></div>

    <div class="sidebar-sep" style="width:100%"></div>
    <div class="panel-title">Custom Colors</div>
    <div class="custom-colors-row" id="customRow">
      <div class="add-color-btn" title="Add current color to custom palette">
        +
        <input type="color" id="customColorAdder">
      </div>
    </div>

    <div class="sidebar-sep" style="width:100%"></div>
    <div class="panel-title">Brush Preview</div>
    <div class="brush-preview-wrap">
      <div class="brush-preview">
        <canvas id="previewCanvas" width="78" height="78"></canvas>
      </div>
      <div style="font-size:10px;color:var(--muted);text-align:center;line-height:1.5" id="brushDesc">Pen brush</div>
    </div>

    <div class="sidebar-sep" style="width:100%"></div>
    <div class="panel-title">History</div>
    <div class="history-info" id="historyDots"></div>
    <div style="font-size:9px;color:var(--muted)" id="historyLabel">0 / 0 steps</div>

  </div>
</div>

<script>
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');
const previewCanvas = document.getElementById('previewCanvas');
const pCtx = previewCanvas.getContext('2d');

// STATE
let tool = 'pen';
let color = '#2c2c2c';
let size = 12;
let opacity = 1;
let drawing = false;
let lastX = 0, lastY = 0;
let startX = 0, startY = 0;
let history = [];
let historyIndex = -1;
const MAX_HISTORY = 30;
let snapshotBeforeDraw = null;

// PALETTE
const palette = [
  '#1a1a1a','#3d3d3d','#6b6b6b','#a0a0a0','#e0e0e0',
  '#ffffff','#f7f3eb','#d4b896','#a07850','#6b4a28',
  '#c94040','#e06060','#e88080','#8b2020','#5a0f0f',
  '#d47030','#e89050','#f0b060','#c85010','#8a3010',
  '#d4c040','#c0a820','#e0d060','#8a7c10','#5a5000',
  '#30a050','#50b870','#80cc90','#186030','#0a3818',
  '#3070c0','#4090d8','#60b0e8','#1a4888','#0a2448',
  '#7040b0','#9060c8','#a880d8','#4a1e80','#260f48',
  '#c04080','#d06090','#e080a8','#8a1858','#500a30',
];

function initCanvas() {
  const area = document.getElementById('canvasArea');
  const W = Math.min(area.clientWidth - 60, 1200);
  const H = Math.min(area.clientHeight - 60, 800);
  canvas.width = W;
  canvas.height = H;
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);
  document.getElementById('canvasSize').textContent = `${W} × ${H}`;
  saveHistory();
}

function buildPalette() {
  const grid = document.getElementById('paletteGrid');
  palette.forEach(c => {
    const sw = document.createElement('div');
    sw.className = 'swatch';
    sw.style.background = c;
    sw.title = c;
    if (c === color) sw.classList.add('selected');
    sw.onclick = () => selectColor(c);
    grid.appendChild(sw);
  });
}

function selectColor(c) {
  color = c;
  document.getElementById('currentSwatch').style.background = c;
  document.getElementById('colorPickerInput').value = c;
  document.getElementById('hexInput').value = c;
  document.querySelectorAll('.swatch').forEach(s => {
    s.classList.toggle('selected', s.style.background === hexToRgb(c) || s.style.background === c);
  });
  document.querySelectorAll('.custom-swatch').forEach(s => {
    s.classList.toggle('selected', s.dataset.color === c);
  });
  updatePreview();
  if (tool.startsWith('eraser')) selectTool(tool);
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgb(${r}, ${g}, ${b})`;
}

// HEX INPUT
document.getElementById('hexInput').addEventListener('change', e => {
  let v = e.target.value.trim();
  if (!v.startsWith('#')) v = '#' + v;
  if (/^#[0-9a-fA-F]{6}$/.test(v)) selectColor(v);
});
document.getElementById('colorPickerInput').addEventListener('input', e => {
  selectColor(e.target.value);
});

// TOOLS
const toolDefs = {
  pen: 'Pen — precise ink',
  brush: 'Brush — soft edges',
  marker: 'Marker — flat ink',
  chalk: 'Chalk — rough texture',
  spray: 'Spray — scattered dots',
  watercolor: 'Watercolor — translucent',
  'eraser-s': 'Eraser S — 10px',
  'eraser-m': 'Eraser M — 30px',
  'eraser-l': 'Eraser L — 60px',
  line: 'Line tool',
  rect: 'Rectangle tool',
  circle: 'Circle/Ellipse tool',
};

function selectTool(t) {
  tool = t;
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('btn-' + t);
  if (btn) btn.classList.add('active');
  document.getElementById('currentToolInfo').textContent = t;
  document.getElementById('brushDesc').textContent = toolDefs[t] || t;

  const eraserSizes = {'eraser-s':10,'eraser-m':30,'eraser-l':60};
  if (eraserSizes[t]) {
    setSize(eraserSizes[t]);
  }
  canvas.style.cursor = t.startsWith('eraser') ? 'cell' : 'crosshair';
  updatePreview();
}

function setSize(s) {
  size = s;
  document.getElementById('sizeSlider').value = s;
  document.getElementById('sizeDisplay').textContent = s;
  updatePreview();
}

document.getElementById('sizeSlider').addEventListener('input', e => {
  setSize(parseInt(e.target.value));
});
document.getElementById('opacitySlider').addEventListener('input', e => {
  opacity = parseInt(e.target.value) / 100;
  document.getElementById('opacityVal').textContent = e.target.value + '%';
  updatePreview();
});

// ADD CUSTOM COLOR
document.getElementById('customColorAdder').addEventListener('input', e => {
  addCustomColor(e.target.value);
});
document.querySelector('.add-color-btn').addEventListener('click', () => {
  addCustomColor(color);
});

function addCustomColor(c) {
  const row = document.getElementById('customRow');
  const existing = row.querySelectorAll('.custom-swatch');
  for (let s of existing) if (s.dataset.color === c) { selectColor(c); return; }
  if (existing.length >= 10) existing[0].remove();
  const sw = document.createElement('div');
  sw.className = 'custom-swatch';
  sw.style.background = c;
  sw.dataset.color = c;
  sw.title = c;
  sw.onclick = () => selectColor(c);
  row.insertBefore(sw, row.querySelector('.add-color-btn'));
  selectColor(c);
}

// BRUSH PREVIEW
function updatePreview() {
  pCtx.clearRect(0, 0, 78, 78);
  pCtx.fillStyle = '#fff';
  pCtx.fillRect(0, 0, 78, 78);

  if (tool.startsWith('eraser')) {
    pCtx.strokeStyle = '#ccc';
    pCtx.lineWidth = 1;
    pCtx.setLineDash([3,3]);
    pCtx.beginPath();
    pCtx.arc(39, 39, Math.min(size/2, 34), 0, Math.PI * 2);
    pCtx.stroke();
    pCtx.setLineDash([]);
    return;
  }

  const s = Math.min(size, 50);
  pCtx.globalAlpha = opacity;

  if (tool === 'pen') {
    pCtx.strokeStyle = color;
    pCtx.lineWidth = s;
    pCtx.lineCap = 'round';
    pCtx.lineJoin = 'round';
    pCtx.beginPath();
    pCtx.moveTo(12, 60);
    pCtx.bezierCurveTo(20, 20, 55, 55, 66, 18);
    pCtx.stroke();
  } else if (tool === 'brush') {
    for (let i = 0; i < 60; i++) {
      const t2 = i / 60;
      const px = 12 + (66 - 12) * t2;
      const py = 60 + (18 - 60) * t2 + Math.sin(t2 * Math.PI * 3) * 12;
      const r = (s / 2) * (0.5 + Math.random() * 0.5);
      pCtx.globalAlpha = opacity * (0.05 + Math.random() * 0.1);
      pCtx.fillStyle = color;
      pCtx.beginPath();
      pCtx.arc(px, py, r, 0, Math.PI * 2);
      pCtx.fill();
    }
    pCtx.globalAlpha = opacity;
  } else if (tool === 'marker') {
    pCtx.globalAlpha = opacity * 0.8;
    pCtx.strokeStyle = color;
    pCtx.lineWidth = s * 1.2;
    pCtx.lineCap = 'square';
    pCtx.beginPath();
    pCtx.moveTo(10, 55); pCtx.lineTo(68, 20);
    pCtx.stroke();
  } else if (tool === 'chalk') {
    for (let i = 0; i < 120; i++) {
      const t2 = i / 120;
      const px = 12 + (66 - 12) * t2 + (Math.random() - 0.5) * s * 0.5;
      const py = 60 + (18 - 60) * t2 + (Math.random() - 0.5) * s * 0.5;
      pCtx.globalAlpha = opacity * (0.2 + Math.random() * 0.5);
      pCtx.fillStyle = color;
      pCtx.fillRect(px, py, Math.random() * 2 + 0.5, Math.random() * 2 + 0.5);
    }
  } else if (tool === 'spray') {
    pCtx.fillStyle = color;
    for (let i = 0; i < 80; i++) {
      const angle = Math.random() * Math.PI * 2;
      const r = Math.random() * s;
      pCtx.globalAlpha = opacity * (0.1 + Math.random() * 0.6);
      pCtx.beginPath();
      pCtx.arc(39 + Math.cos(angle) * r, 39 + Math.sin(angle) * r, 0.8, 0, Math.PI * 2);
      pCtx.fill();
    }
  } else if (tool === 'watercolor') {
    for (let i = 0; i < 5; i++) {
      pCtx.globalAlpha = opacity * 0.08;
      pCtx.fillStyle = color;
      pCtx.beginPath();
      pCtx.ellipse(39 + (Math.random()-0.5)*10, 39 + (Math.random()-0.5)*10,
        s + Math.random()*10, (s + Math.random()*10)*0.6, Math.random()*Math.PI, 0, Math.PI*2);
      pCtx.fill();
    }
  }

  pCtx.globalAlpha = 1;
}

// DRAWING LOGIC
function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const src = e.touches ? e.touches[0] : e;
  return {
    x: (src.clientX - rect.left) * (canvas.width / rect.width),
    y: (src.clientY - rect.top) * (canvas.height / rect.height)
  };
}

function setupCtx() {
  if (tool.startsWith('eraser')) {
    ctx.globalCompositeOperation = 'destination-out';
    ctx.globalAlpha = 1;
  } else if (tool === 'watercolor') {
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = opacity * 0.08;
  } else if (tool === 'marker') {
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = opacity * 0.85;
  } else {
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = opacity;
  }
}

function drawBrushAt(x, y, px, py) {
  ctx.strokeStyle = color;
  ctx.fillStyle = color;

  if (tool === 'pen') {
    ctx.lineWidth = size;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(x, y);
    ctx.stroke();
  } else if (tool === 'brush') {
    const dist = Math.hypot(x - px, y - py);
    const steps = Math.max(1, Math.floor(dist / 2));
    for (let i = 0; i <= steps; i++) {
      const tx = px + (x - px) * (i / steps);
      const ty = py + (y - py) * (i / steps);
      for (let j = 0; j < 8; j++) {
        const angle = Math.random() * Math.PI * 2;
        const r = Math.random() * size * 0.6;
        ctx.globalAlpha = opacity * (0.03 + Math.random() * 0.08);
        ctx.beginPath();
        ctx.arc(tx + Math.cos(angle) * r, ty + Math.sin(angle) * r, size * 0.3 * Math.random(), 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = opacity;
  } else if (tool === 'marker') {
    ctx.lineWidth = size * 1.3;
    ctx.lineCap = 'square';
    ctx.lineJoin = 'miter';
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(x, y);
    ctx.stroke();
  } else if (tool === 'chalk') {
    const dist = Math.hypot(x - px, y - py);
    const steps = Math.max(1, Math.floor(dist / 1));
    for (let i = 0; i <= steps; i++) {
      const tx = px + (x - px) * (i / steps);
      const ty = py + (y - py) * (i / steps);
      for (let j = 0; j < 12; j++) {
        const ox = (Math.random() - 0.5) * size * 0.8;
        const oy = (Math.random() - 0.5) * size * 0.8;
        ctx.globalAlpha = opacity * (0.15 + Math.random() * 0.5);
        ctx.fillRect(tx + ox, ty + oy, Math.random() * 2 + 0.5, Math.random() * 2 + 0.5);
      }
    }
    ctx.globalAlpha = opacity;
  } else if (tool === 'spray') {
    const density = Math.max(10, size * 3);
    for (let i = 0; i < density; i++) {
      const angle = Math.random() * Math.PI * 2;
      const r = Math.random() * size;
      ctx.globalAlpha = opacity * (0.08 + Math.random() * 0.4);
      ctx.beginPath();
      ctx.arc(x + Math.cos(angle) * r, y + Math.sin(angle) * r, 0.8, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = opacity;
  } else if (tool === 'watercolor') {
    ctx.lineWidth = size;
    ctx.lineCap = 'round';
    for (let i = 0; i < 4; i++) {
      ctx.globalAlpha = opacity * 0.06;
      ctx.beginPath();
      ctx.moveTo(px + (Math.random()-0.5)*4, py + (Math.random()-0.5)*4);
      ctx.lineTo(x + (Math.random()-0.5)*4, y + (Math.random()-0.5)*4);
      ctx.stroke();
    }
    ctx.globalAlpha = opacity * 0.03;
    ctx.beginPath();
    ctx.arc(x, y, size * (0.5 + Math.random() * 0.5), 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = opacity;
  } else if (tool.startsWith('eraser')) {
    ctx.lineWidth = size;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(x, y);
    ctx.stroke();
  }
}

function onPointerDown(e) {
  e.preventDefault();
  drawing = true;
  const pos = getPos(e);
  lastX = startX = pos.x;
  lastY = startY = pos.y;
  snapshotBeforeDraw = ctx.getImageData(0, 0, canvas.width, canvas.height);
  setupCtx();

  if (!['line','rect','circle'].includes(tool)) {
    if (tool === 'spray') {
      drawBrushAt(pos.x, pos.y, pos.x, pos.y);
    } else {
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, tool.startsWith('eraser') ? size/2 : size/2, 0, Math.PI*2);
      ctx.fillStyle = color;
      if (!tool.startsWith('eraser')) ctx.fill();
    }
  }
}

function onPointerMove(e) {
  e.preventDefault();
  const pos = getPos(e);
  document.getElementById('coordInfo').textContent = `${Math.round(pos.x)}, ${Math.round(pos.y)}`;

  if (!drawing) return;
  setupCtx();

  if (['line','rect','circle'].includes(tool)) {
    ctx.putImageData(snapshotBeforeDraw, 0, 0);
    ctx.globalAlpha = opacity;
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = color;
    ctx.lineWidth = size;
    ctx.lineCap = 'round';
    if (tool === 'line') {
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    } else if (tool === 'rect') {
      ctx.beginPath();
      ctx.rect(startX, startY, pos.x - startX, pos.y - startY);
      ctx.stroke();
    } else if (tool === 'circle') {
      ctx.beginPath();
      ctx.ellipse(
        (startX + pos.x) / 2, (startY + pos.y) / 2,
        Math.abs(pos.x - startX) / 2, Math.abs(pos.y - startY) / 2,
        0, 0, Math.PI * 2
      );
      ctx.stroke();
    }
  } else {
    drawBrushAt(pos.x, pos.y, lastX, lastY);
  }

  lastX = pos.x;
  lastY = pos.y;
}

function onPointerUp(e) {
  if (!drawing) return;
  drawing = false;
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  saveHistory();
}

canvas.addEventListener('mousedown', onPointerDown);
canvas.addEventListener('mousemove', onPointerMove);
canvas.addEventListener('mouseup', onPointerUp);
canvas.addEventListener('mouseleave', onPointerUp);
canvas.addEventListener('touchstart', onPointerDown, {passive: false});
canvas.addEventListener('touchmove', onPointerMove, {passive: false});
canvas.addEventListener('touchend', onPointerUp);

// HISTORY
function saveHistory() {
  if (historyIndex < history.length - 1) {
    history = history.slice(0, historyIndex + 1);
  }
  history.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
  if (history.length > MAX_HISTORY) history.shift();
  historyIndex = history.length - 1;
  updateHistoryUI();
}

function undo() {
  if (historyIndex > 0) {
    historyIndex--;
    ctx.putImageData(history[historyIndex], 0, 0);
    updateHistoryUI();
  }
}

function redo() {
  if (historyIndex < history.length - 1) {
    historyIndex++;
    ctx.putImageData(history[historyIndex], 0, 0);
    updateHistoryUI();
  }
}

function updateHistoryUI() {
  const total = history.length;
  const current = historyIndex + 1;
  document.getElementById('historyLabel').textContent = `${current} / ${total} steps`;
  const dots = document.getElementById('historyDots');
  dots.innerHTML = '';
  const show = Math.min(total, 10);
  for (let i = 0; i < show; i++) {
    const d = document.createElement('div');
    d.className = 'hist-dot' + (i === (historyIndex % show) ? ' active' : '');
    dots.appendChild(d);
  }
}

function clearCanvas() {
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  saveHistory();
}

function downloadImage() {
  const tmpCanvas = document.createElement('canvas');
  tmpCanvas.width = canvas.width;
  tmpCanvas.height = canvas.height;
  const tmpCtx = tmpCanvas.getContext('2d');
  tmpCtx.fillStyle = '#ffffff';
  tmpCtx.fillRect(0, 0, tmpCanvas.width, tmpCanvas.height);
  tmpCtx.drawImage(canvas, 0, 0);

  const link = document.createElement('a');
  link.download = 'canvas-studio-' + Date.now() + '.png';
  link.href = tmpCanvas.toDataURL('image/png');
  link.click();
}

// KEYBOARD
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); undo(); }
  if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.shiftKey && e.key === 'z'))) { e.preventDefault(); redo(); }
  if (e.key === 'p') selectTool('pen');
  if (e.key === 'b') selectTool('brush');
  if (e.key === 'm') selectTool('marker');
  if (e.key === 'c') selectTool('chalk');
  if (e.key === 's') selectTool('spray');
  if (e.key === 'w') selectTool('watercolor');
  if (e.key === 'e') selectTool('eraser-m');
  if (e.key === '[') setSize(Math.max(1, size - 2));
  if (e.key === ']') setSize(Math.min(80, size + 2));
});

// INIT
initCanvas();
buildPalette();
selectColor('#2c2c2c');
updatePreview();
updateHistoryUI();

window.addEventListener('resize', () => {
  const data = ctx.getImageData(0, 0, canvas.width, canvas.height);
  initCanvas();
  ctx.putImageData(data, 0, 0);
});
</script>
